spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      leak-detection-threshold: 0
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      connect-timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 5
          min-idle: 2
          max-wait: 200ms
          time-between-eviction-runs: 30s
        shutdown-timeout: 100ms

logging:
  level:
    root: WARN
    com.app.ratelimiter: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
  mcp:
    secret: ${MCP_SECRET}
