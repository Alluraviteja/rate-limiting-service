spring:
  application:
    name: rate-limiting-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rate_limiter}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:app_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
  liquibase:
    change-log: classpath:db/changelog/master.xml
    enabled: true
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 5
          min-idle: 2
        shutdown-timeout: 100ms

server:
  port: ${SERVER_PORT:8081}

app:
  ratelimit:
    redis:
      failure-strategy: fail-open
  security:
    jwt:
      secret: ${JWT_SECRET:local-dev-secret-do-not-use-in-production}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis