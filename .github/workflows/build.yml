name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            IMAGE=${{ secrets.DOCKER_USERNAME }}/rate-limiting-service:${{ github.event.workflow_run.head_sha }}

            # Pull new image before stopping old container to minimise downtime
            docker pull $IMAGE

            # Keep track of previous image for rollback (empty string if first deploy)
            PREVIOUS_IMAGE=$(docker inspect --format='{{.Config.Image}}' rate-limiting-service 2>/dev/null || echo "")

            # Swap containers
            docker stop rate-limiting-service || true
            docker rm rate-limiting-service || true
            docker run -d \
              --name rate-limiting-service \
              --restart always \
              --add-host=host.docker.internal:host-gateway \
              --network ${{ secrets.DOCKER_NETWORK }} \
              -e SERVER_PORT=${{ secrets.CONTAINER_PORT }} \
              -e DB_URL=${{ secrets.DB_URL }} \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e REDIS_HOST=${{ secrets.REDIS_HOST }} \
              -e REDIS_PORT=${{ secrets.REDIS_PORT }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e LOG_LEVEL=${{ secrets.LOG_LEVEL }} \
              -p ${{ secrets.HOST_PORT }}:${{ secrets.CONTAINER_PORT }} \
              $IMAGE

            # Verify container is running
            sleep 5
            if ! docker ps --filter "name=rate-limiting-service" --filter "status=running" | grep -q rate-limiting-service; then
              echo "Container failed to start"
              docker stop rate-limiting-service || true
              docker rm rate-limiting-service || true

              if [ -n "$PREVIOUS_IMAGE" ]; then
                echo "Rolling back to $PREVIOUS_IMAGE"
                docker run -d \
                  --name rate-limiting-service \
                  --restart always \
                  --add-host=host.docker.internal:host-gateway \
                  --network ${{ secrets.DOCKER_NETWORK }} \
                  -e SERVER_PORT=${{ secrets.CONTAINER_PORT }} \
                  -e DB_URL=${{ secrets.DB_URL }} \
                  -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
                  -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
                  -e REDIS_HOST=${{ secrets.REDIS_HOST }} \
                  -e REDIS_PORT=${{ secrets.REDIS_PORT }} \
                  -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
                  -e LOG_LEVEL=${{ secrets.LOG_LEVEL }} \
                  -p ${{ secrets.HOST_PORT }}:${{ secrets.CONTAINER_PORT }} \
                  $PREVIOUS_IMAGE
              else
                echo "No previous image to roll back to — this was the first deploy"
              fi
              exit 1
            fi

            echo "Deployment successful — running $IMAGE"
